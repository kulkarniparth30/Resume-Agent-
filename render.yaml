services:
  # Full-Stack Web Service on Render (Free Tier Friendly)
  - type: web
    name: resume-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard
      - key: GROQ_API_KEY
        sync: false # Set in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
